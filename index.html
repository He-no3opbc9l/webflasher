<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebFlash — AT32 / STM32 via ST-Link</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>WebFlash</h1>
    <p data-i18n="subtitle"></p>
  </div>
  <nav id="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></nav>
</header>

<div id="nousb" class="banner bad" hidden></div>

<main>
  <section class="card">
    <h2 data-i18n="probeTitle"></h2>
    <div class="row">
      <button id="connect" class="primary" data-i18n="connect"></button>
      <label><span data-i18n="speed"></span>
        <select id="speed">
          <option value="4000">4 MHz</option>
          <option value="1800" selected>1.8 MHz</option>
          <option value="950">950 kHz</option>
          <option value="480">480 kHz</option>
          <option value="100">100 kHz</option>
        </select>
      </label>
      <button id="disconnect" data-i18n="disconnect" disabled></button>
    </div>
    <p id="probe" class="muted"></p>
  </section>

  <section class="card">
    <h2 data-i18n="chipTitle"></h2>
    <p id="nochip" class="muted" data-i18n="noChip"></p>
    <div id="chip" hidden>
      <table>
        <tr><th data-i18n="model"></th><td id="c-model"></td></tr>
        <tr><th data-i18n="core"></th><td id="c-core"></td></tr>
        <tr><th>IDCODE</th><td id="c-id" class="mono"></td></tr>
        <tr><th data-i18n="flash"></th><td><input id="c-size" type="number" min="1" max="4096" step="1"> <span data-i18n="kb"></span> <span id="c-size-note" class="warn"></span></td></tr>
        <tr><th data-i18n="uid"></th><td id="c-uid" class="mono"></td></tr>
        <tr><th data-i18n="rdp"></th><td id="c-rdp"></td></tr>
        <tr><th data-i18n="wrp"></th><td id="c-wrp"></td></tr>
      </table>
      <p id="rdphint" class="banner bad" data-i18n="rdpHint" hidden></p>
      <p id="wrphint" class="banner warnbox" data-i18n="wrpHint" hidden></p>
      <div class="row">
        <button id="refresh" data-i18n="refresh"></button>
        <button id="unprotect" class="danger" data-i18n="unprotect"></button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="backupTitle"></h2>
    <div class="row"><button id="backup" class="primary" data-i18n="backupBtn" disabled></button></div>
    <p class="muted" data-i18n="backupHint"></p>
  </section>

  <section class="card">
    <h2 data-i18n="flashTitle"></h2>
    <label id="drop" class="drop">
      <input id="file" type="file" accept=".bin,application/octet-stream">
      <span id="fileinfo" data-i18n="drop"></span>
    </label>
    <div class="row">
      <label><span data-i18n="addr"></span> <input id="addr" class="mono" value="0x08000000" size="12"></label>
    </div>
    <label class="check"><input id="o-backup" type="checkbox" checked> <span data-i18n="optBackup"></span></label>
    <label class="check"><input id="o-mass" type="checkbox"> <span data-i18n="optMass"></span></label>
    <label class="check"><input id="o-run" type="checkbox" checked> <span data-i18n="optRun"></span></label>
    <div class="row">
      <button id="write" class="primary" data-i18n="write" disabled></button>
      <button id="compare" data-i18n="compare" disabled></button>
    </div>
  </section>

  <section class="card wide">
    <div id="status"></div>
    <progress id="progress" max="1" value="0" hidden></progress>
    <details open>
      <summary data-i18n="log"></summary>
      <pre id="log"></pre>
    </details>
  </section>

  <section class="card wide">
    <h2 data-i18n="notesTitle"></h2>
    <div data-i18n-html="notes"></div>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
